[project]
name = "bookshelf"
version = "0.1.0"
description = "A local book library"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.2,<4",
    "pillow>=13.0.0,<14",
    "pymupdf>=2.1,<3",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
