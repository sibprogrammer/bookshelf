{% macro heart(filled=false) -%}
<svg width="20" height="20" viewBox="0 0 24 24" fill="{{ 'currentColor' if filled else 'none' }}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>
</svg>
{%- endmacro %}

{% macro bookmark(filled=false) -%}
<svg width="20" height="20" viewBox="0 0 24 24" fill="{{ 'currentColor' if filled else 'none' }}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M6 3h12v18l-6-4-6 4Z"/>
</svg>
{%- endmacro %}

{% macro checkmark() -%}
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="m5 12 4 4L19 6"/>
</svg>
{%- endmacro %}

{% macro reload() -%}
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M20 4v5h-5M20 9a8 8 0 1 0 .2 5"/>
</svg>
{%- endmacro %}
